<title>Conteúdo Blindado</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    background: radial-gradient(circle at 20% 30%, #0a0f1a, #030507);
    font-family: 'Segoe UI', 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.container{
    background: rgba(10,20,30,0.90);
    backdrop-filter: blur(14px);
    border-radius: 32px;
    border: 1px solid rgba(0,255,255,0.3);
    box-shadow: 0 20px 48px rgba(0,0,0,0.6), 0 0 24px rgba(0,255,255,0.12);
    padding: 2rem;
    width: 100%;
    max-width: 500px;
    text-align: center;
}
.top-bar{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 0.5rem;
}
.title{
    font-size: 1.2rem;
    background: linear-gradient(135deg, #0ff, #0f0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 1px;
}
.expira-info{
    font-size: 0.8rem;
    color: #4cc;
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
}
.expira-info .label{
    color: #4cc;
}
.expira-info .value{
    color: #0ff;
    font-family: monospace;
    font-weight: bold;
}
.countdown-info{
    font-size: 0.8rem;
    color: #4cc;
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
}
.countdown-info .value{
    font-family: monospace;
    font-weight: bold;
    color: #0f0;
}
.countdown-info.urgente .value{
    color: #f55;
    animation: piscar 1s infinite;
}
@keyframes piscar{
    50% { opacity: 0.4; }
}
input[type=text]{
    background: #0a121c;
    border: 2px solid #2a6a6a;
    border-radius: 48px;
    padding: 12px 20px;
    width: 100%;
    color: #0ff;
    font-size: 1rem;
    font-family: monospace;
    text-align: center;
    letter-spacing: 3px;
    outline: none;
    transition: 0.2s border-color;
    margin-bottom: 12px;
}
input[type=text]:focus{
    border-color: #0ff;
    box-shadow: 0 0 18px #0ff3;
}
input[type=text]::placeholder{
    color: #2a6a6a;
    letter-spacing: 1px;
}
button{
    background: linear-gradient(95deg, #0a2a2a, #0a3a3a);
    border: none;
    border-radius: 48px;
    padding: 10px 24px;
    width: 100%;
    font-size: 1rem;
    font-weight: bold;
    color: #0ff;
    cursor: pointer;
    transition: 0.2s;
}
button:hover{
    background: linear-gradient(95deg, #0c3c3c, #0e5e5e);
    color: #fff;
    box-shadow: 0 0 14px #0ff5;
    transform: scale(1.02);
}
.erro{
    color: #f66;
    margin-top: 10px;
    font-size: 0.8rem;
    display: none;
    padding: 6px 12px;
    background: #1a0505;
    border-radius: 10px;
    border: 1px solid #5a1a1a;
}
footer{
    margin-top: 1.5rem;
    font-size: 0.7rem;
    color: #2a6a6a;
}
.loader{
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #0ff;
    border-top: 2px solid transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
}
@keyframes spin{
    to { transform: rotate(360deg); }
}
</style>

const UNIDADE       = "horas";
const DATA_INICIO   = "2026-04-01T10:00:00";
const DURACAO       = 5000;
const CHAVE_ARQUIVO = "57ff6b8bcc4b7afaf0175f2da206d72543235b71c419c294383a844db71dbdcc";
const EXPIRA_ISO    = "2026-10-26T18:00:00";

const C_JUBILO   = 54;
const C_GRATIDAO = 180;
const C_MARC     = 45;

let _intervalo = null;

function normalizarDt(dt) {
    if (UNIDADE === "dias")
        return new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
    if (UNIDADE === "horas")
        return new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate(), dt.getHours()));
    return new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate(), dt.getHours(), dt.getMinutes()));
}

function calcularIndice(dtNorm) {
    const inicio = normalizarDt(new Date(DATA_INICIO));
    const diffMs = dtNorm - inicio;
    if (UNIDADE === "dias")  return Math.floor(diffMs / 86400000);
    if (UNIDADE === "horas") return Math.floor(diffMs / 3600000);
    return Math.floor(diffMs / 60000);
}

function proximaTroca(dtNorm) {
    if (UNIDADE === "dias")
        return new Date(dtNorm.getFullYear(), dtNorm.getMonth(), dtNorm.getDate() + 1);
    if (UNIDADE === "horas")
        return new Date(dtNorm.getFullYear(), dtNorm.getMonth(), dtNorm.getDate(),
                        dtNorm.getHours() + 1);
    return new Date(dtNorm.getFullYear(), dtNorm.getMonth(), dtNorm.getDate(),
                    dtNorm.getHours(), dtNorm.getMinutes() + 1);
}

function slotMs() {
    if (UNIDADE === "dias")    return 86400000;
    if (UNIDADE === "horas")   return 3600000;
    return 60000;
}

function pad(n) { return String(n).padStart(2, "0"); }

function formatarContagem(ms) {
    if (ms <= 0) return "00:00:00";
    const s  = Math.floor(ms / 1000);
    const hh = Math.floor(s / 3600);
    const mm = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    if (UNIDADE === "minutos") return `${pad(mm)}:${pad(ss)}`;
    return `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
}

function atualizarPainel() {
    const agora    = new Date();
    const dtNorm   = normalizarDt(agora);
    const indice   = calcularIndice(dtNorm);
    const expira   = new Date(EXPIRA_ISO);
    const expirou  = agora >= expira;
    const foraAntes= indice < 0;

    const cdEl   = document.getElementById("countdown");
    const cdInfo = document.getElementById("countdownInfo");
    const btnEl  = document.querySelector("button");

    if (expirou || foraAntes || indice >= DURACAO) {
        cdEl.textContent  = "EXPIRADO";
        cdInfo.className  = "countdown-info urgente";
        if (btnEl) btnEl.disabled = true;
        document.getElementById("senha").disabled = true;
        if (_intervalo) clearInterval(_intervalo);
        return;
    }

    const proxTroca   = proximaTroca(dtNorm);
    const msRestante  = proxTroca - agora;
    const pct         = Math.min(100, Math.max(0, (msRestante / slotMs()) * 100));

    cdEl.textContent  = formatarContagem(msRestante);
    cdInfo.className  = msRestante < 60000 ? "countdown-info urgente" : "countdown-info";
}

    const fullDiv = document.createElement("div");
    fullDiv.style.position = "fixed";
    fullDiv.style.top = "0";
    fullDiv.style.left = "0";
    fullDiv.style.width = "100%";
    fullDiv.style.height = "100%";
    fullDiv.style.zIndex = "9999";
    fullDiv.style.background = "#fff";
    fullDiv.style.overflow = "auto";
    const pre = document.createElement("pre");
    pre.textContent = trimmed;
    pre.style.padding = "1rem";
    pre.style.margin = "0";
    pre.style.background = "#f5f5f5";
    fullDiv.appendChild(pre);
    document.body.innerHTML = "";
    document.body.appendChild(fullDiv);
    document.body.style.margin = "0";
    document.body.style.padding = "0";
}

function mostrarErro(msg) {
    const el = document.getElementById("erro");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 5000);
}

async function sha256bytes(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return new Uint8Array(buf);
}

async function gerarSenhaPorSlot(indice, tsIso) {
    const entrada = `${CHAVE_ARQUIVO}|${tsIso}|${indice}|${C_JUBILO}|${C_GRATIDAO}|${C_MARC}`;
    const h = await sha256bytes(entrada);
    function btt(b1, b2) { const v = (b1^b2)%9; return v||9; }
    function L(n) { return String.fromCharCode(64+n); }
    const r1=btt(h[0],h[1]), r2=btt(h[8],h[9]), r3=btt(h[16],h[17]), r4=btt(h[24],h[25]);
    return `${L(r1)}${r1}-${L(r2)}${r2}-${L(r3)}${r3}-${L(r4)}${r4}`;
}

async function aesGcmDecrypt(obj, keyBytes) {
    const key   = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
    const nonce = Uint8Array.from(atob(obj.nonce), c => c.charCodeAt(0));
    const tag   = Uint8Array.from(atob(obj.tag),   c => c.charCodeAt(0));
    const ct    = Uint8Array.from(atob(obj.data),  c => c.charCodeAt(0));
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce, tagLength: 128 }, key,
                                 new Uint8Array([...ct, ...tag]));
}

async function desbloquear() {
    const senhaInput = document.getElementById("senha").value.trim().toUpperCase();
    if (!senhaInput) return;

    const agora  = new Date();
    const dtNorm = normalizarDt(agora);
    const indiceAtual = calcularIndice(dtNorm);

    if (agora >= new Date(EXPIRA_ISO) || indiceAtual < 0 || indiceAtual >= DURACAO) {
        mostrarErro("⛔ Período expirado.");
        return;
    }

    // Procurar senha em slots futuros (a partir do atual)
    let envelopeIndex = null;
    for (let i = indiceAtual; i < DURACAO; i++) {
        const tsSlot = TIMESTAMPS[i];
        const senhaSlot = await gerarSenhaPorSlot(i, tsSlot);
        if (senhaInput === senhaSlot) {
            envelopeIndex = i;
            break;
        }
    }

    if (envelopeIndex === null) {
        mostrarErro("❌ Senha incorreta ou já expirada.");
        return;
    }

    const btn = document.querySelector("button");
    const txtBtn = btn.innerText;
    btn.innerText = "🔐 VERIFICANDO";
    const loader = document.createElement("span");
    loader.className = "loader";
    btn.appendChild(loader);

    try {
        const chaveD      = await sha256bytes(senhaInput);
        const masterBuf   = await aesGcmDecrypt(ENVELOPES[envelopeIndex], chaveD);
        const conteudoBuf = await aesGcmDecrypt(MAIN_DATA, new Uint8Array(masterBuf));
        const texto       = new TextDecoder().decode(conteudoBuf);
        mostrarConteudoFullscreen(texto);
    } catch(e) {
        mostrarErro("❌ Falha na descriptografia: " + (e.message || "erro desconhecido"));
        btn.innerText = txtBtn;
        if (loader.parentNode) loader.remove();
    }
}

atualizarPainel();
_intervalo = setInterval(atualizarPainel, 1000);

document.getElementById("senha").addEventListener("keypress", e => {
    if (e.key === "Enter") desbloquear();
});
